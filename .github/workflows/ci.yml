name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # Tests use client-go's fake clientset; no cluster or kubeconfig is needed.
        env:
          KUBECONFIG: /dev/null
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage report and threshold
        env:
          MIN_COVERAGE: "80"
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(awk '/^total:/ { sub(/%/, "", $NF); print $NF }' coverage.txt)
          echo "### Test coverage: ${total}% (minimum ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t + 0 < m + 0) }'; then
            echo "::error::Total coverage ${total}% is below the ${MIN_COVERAGE}% minimum"
            exit 1
          fi
          echo "Total coverage ${total}% meets the ${MIN_COVERAGE}% minimum"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: ignore
          retention-days: 14
