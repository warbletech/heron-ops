name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test (Go ${{ matrix.go.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go:
          # Oldest Go allowed by the `go` directive in go.mod, and the current stable release.
          - name: go.mod minimum
            version-file: go.mod
            version: ""
            coverage: false
          - name: stable
            version-file: ""
            version: stable
            coverage: true
    env:
      # go.work pins a newer Go than go.mod; ignore it so each matrix entry really
      # builds with its own toolchain instead of auto-downloading a newer one.
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go.version }}
          go-version-file: ${{ matrix.go.version-file }}
          cache-dependency-path: go.sum

      - run: go version

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # Tests use client-go's fake clientset; no cluster or kubeconfig is needed.
        env:
          KUBECONFIG: /dev/null
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage report and threshold
        env:
          MIN_COVERAGE: "80"
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(awk '/^total:/ { sub(/%/, "", $NF); print $NF }' coverage.txt)
          echo "### Test coverage: ${total}% (minimum ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t + 0 < m + 0) }'; then
            echo "::error::Total coverage ${total}% is below the ${MIN_COVERAGE}% minimum"
            exit 1
          fi
          echo "Total coverage ${total}% meets the ${MIN_COVERAGE}% minimum"

      - name: Upload coverage profile
        if: always() && matrix.go.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  codecov:
    name: upload coverage to Codecov
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # OIDC token for Codecov; no stored secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage

      - name: Upload to Codecov
        # Never fails CI: Codecov must first be enabled for this repo by an org owner.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          disable_search: true
          flags: unittests
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: false
          verbose: true
